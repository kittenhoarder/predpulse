name: Publish market snapshot

on:
  schedule:
    # GitHub can delay or drop scheduled events. Give each hour a second chance.
    - cron: "17,47 * * * *"
  workflow_dispatch:
  # Allows a same-repository pilot before this workflow reaches the default branch.
  push:
    branches:
      - feat/spec-01-snapshot-delivery
      - feat/spec-02-trustworthy-observations
      - feat/spec-02-kalshi-observations
      - feat/spec-03-event-monitor
      - feat/spec-004-venue-comparisons
      - feat/spec-005-event-distribution
      - feat/spec-006-durable-evidence

permissions:
  contents: read

concurrency:
  group: predpulse-snapshot-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Acquire, validate and publish from the GitHub runner
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.PREDPULSE_BLOB_READ_WRITE_TOKEN }}
          INDEX_PERSISTENCE_ENABLED: "false"
        run: npm run publish:snapshot
