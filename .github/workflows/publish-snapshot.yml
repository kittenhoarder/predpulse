name: Publish market snapshot

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: predpulse-hourly-snapshot
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Trigger the bounded publisher
        env:
          SNAPSHOT_PUBLISH_SECRET: ${{ secrets.SNAPSHOT_PUBLISH_SECRET }}
        run: |
          test -n "$SNAPSHOT_PUBLISH_SECRET"
          curl --fail-with-body --silent --show-error --max-time 290 \
            -X POST https://predpulse.xyz/api/internal/publish \
            -H "Authorization: Bearer $SNAPSHOT_PUBLISH_SECRET"
